eId": "node_c2_fisher_sold", "action": {"type": "c2/sell", "payload": {"shopId": "shop_c2_fish", "lines": [{"itemId": "item_c2_fish_a", "quantity": 1}]}}, "requires": [{"kind": "itemOwned", "itemId": "item_c2_fish_a", "quantity": 1}]}, {"id": "choice_c2_fisher_sell__sell_b", "text": "卖一尾鲤鱼", "nextNodeId": "node_c2_fisher_sold", "action": {"type": "c2/sell", "payload": {"shopId": "shop_c2_fish", "lines": [{"itemId": "item_c2_fish_b", "quantity": 1}]}}, "requires": [{"kind": "itemOwned", "itemId": "item_c2_fish_b", "quantity": 1}]}, {"id": "choice_c2_fisher_sell__open_sell", "text": "查看数量与交易", "nextNodeId": null, "intent": {"kind": "openShop", "shopId": "shop_c2_fish"}}, {"id": "choice_c2_fisher_sell__leave", "text": "改日再说", "nextNodeId": null}], "reading": "mandatory", "uiNote": "确认成交后实物离开行囊，风物志记录保留。"}, {"id": "node_c2_fisher_sold", "text": "鲁七点清鱼数，把应付的钱交妥：“这一脚做完了。买饭便去王家，旧器到顾娘子摊上问；石伯那副架，也等你一双稳手。”", "choices": [{"id": "choice_c2_fisher_sold__go_porter", "text": "去看看旧架", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_porter"}}, {"id": "choice_c2_fisher_sold__leave", "text": "改日再说", "nextNodeId": null}], "reading": "mandatory"}, {"id": "node_c2_fisher_frame", "text": "“年轻时他一听响便急，如今反倒不肯叫铃响。丁伯说过，靠声音催脚，不如先把担试稳。那架子的伤不是今日才有。”", "choices": [{"id": "choice_c2_fisher_frame__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_fisher_token_offer", "text": "“旧牌掉在浅水里。你若愿意，用竿从岸上带回来，别涉水。牌本是我家的，取回认过，我便送你留记。”", "choices": [{"id": "choice_c2_fisher_token_offer__token_accept", "text": "帮忙取回木牌", "nextNodeId": "node_c2_fisher_token_where", "action": {"type": "c2/acceptQuest", "payload": {"questId": "quest_c2_token"}}, "requires": [{"kind": "questStatus", "questId": "quest_c2_token", "status": "available"}]}, {"id": "choice_c2_fisher_token_offer__token_resume", "text": "木牌在哪一处？", "nextNodeId": "node_c2_fisher_token_where", "requires": [{"kind": "questStatus", "questId": "quest_c2_token", "status": "active"}]}, {"id": "choice_c2_fisher_token_offer__token_known", "text": "木牌的三刀与五点", "nextNodeId": "node_c2_fisher_token_truth", "requires": [{"kind": "itemOwned", "itemId": "treasure_c2_marked_token", "quantity": 1}]}, {"id": "choice_c2_fisher_token_offer__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_fisher_token_where", "text": "鲁七指向另一处安全岸沿：“旧牌就在近岸浅水的记号处。只在岸上用竿带回来，别涉水。”", "choices": [{"id": "choice_c2_fisher_token_where__go_token", "text": "到那处岸沿", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_fishing_b", "fishingMode": "token"}}, {"id": "choice_c2_fisher_token_where__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional", "uiNote": "固定木牌支线；每杆精力4，成功必得木牌，不使用普通随机池/珍稀保底。"}, {"id": "node_c2_fisher_token_truth", "text": "“三刀是母亲教我数桶的，五点是她记给邻人留鱼。我病着那回，丁伯替我走过这段路。我只数了钱，竟没问过谁走的。牌送你，莫把它当过门凭信。”", "choices": [{"id": "choice_c2_fisher_token_truth__token_record", "text": "记下这段来历", "nextNodeId": "node_c2_fisher_token_recorded", "action": {"type": "c2/advanceStory", "payload": {"storyId": "story_c2_marked_token", "stageId": "stage_c2_marked_token_resolved"}}, "requires": [{"kind": "storyStage", "storyId": "story_c2_marked_token", "stageId": "stage_c2_marked_token_known"}, {"kind": "questStatus", "questId": "quest_c2_token", "status": "completed"}]}, {"id": "choice_c2_fisher_token_truth__token_full", "text": "读木牌故事", "nextNodeId": null, "intent": {"kind": "openStory", "storyId": "story_c2_marked_token"}}, {"id": "choice_c2_fisher_token_truth__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_fisher_token_recorded", "text": "木牌两面的用途已说清。鲁七仍按价卖鱼；这段往来，也已经留在风物志里。", "choices": [{"id": "choice_c2_fisher_token_recorded__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_fisher_debt", "text": "“饭钱别躲着。卖鱼的钱先还4文欠账，余下才归你。若欠着饭钱又没力气，我这几只空鱼桶待擦；做完只替你还所欠，不另送钱。”", "choices": [{"id": "choice_c2_fisher_debt__work", "text": "整理空桶，偿清欠账", "nextNodeId": "node_c2_fisher_debt_done", "action": {"type": "c2/settleReliefWork", "payload": {"npcId": "npc_c2_fisher"}}}, {"id": "choice_c2_fisher_debt__fish_debt", "text": "用鱼偿饭钱", "nextNodeId": "node_c2_fisher_sell"}, {"id": "choice_c2_fisher_debt__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_fisher_debt_done", "text": "鲁七把应还的饭钱替你交妥：“账清了。竿还借你，再做事也先顾肚子。”", "choices": [{"id": "choice_c2_fisher_debt_done__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional", "uiNote": "本次工作免精力、只偿未还饭钱，不另增加铜钱。"}, {"id": "node_c2_fisher_revisit", "text": "“架子在顾娘子摊前稳了，来客的桶也不用横在过道上。你要钓便钓；那块木牌只一块，记人倒还能添许多页。”", "choices": [{"id": "choice_c2_fisher_revisit__fish_again", "text": "去钓鱼", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_fishing_a"}}, {"id": "choice_c2_fisher_revisit__sell_again", "text": "卖鱼", "nextNodeId": "node_c2_fisher_sell"}, {"id": "choice_c2_fisher_revisit__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}]}, {"id": "dialogue_c2_porter", "npcId": "npc_c2_porter", "entryNodeId": "node_c2_porter_entry", "nodes": [{"id": "node_c2_porter_entry", "text": "石伯拇指按在旧木架的白痕上：“新绳我有，这道伤莫涂。顾娘子来收架，我还没答应拆它。”", "choices": [{"id": "choice_c2_porter_entry__main_accept", "text": "问清差事，接下帮忙", "nextNodeId": "node_c2_porter_request", "action": {"type": "c2/acceptQuest", "payload": {"questId": "quest_c2_main"}}, "requires": [{"kind": "questStatus", "questId": "quest_c2_main", "status": "available"}]}, {"id": "choice_c2_porter_entry__main_resume", "text": "接着帮忙", "nextNodeId": "node_c2_porter_request", "requires": [{"kind": "questStatus", "questId": "quest_c2_main", "status": "active"}]}, {"id": "choice_c2_porter_entry__bell_past", "text": "问那只不响的铃", "nextNodeId": "node_c2_porter_bell_past"}, {"id": "choice_c2_porter_entry__go_delivery", "text": "旧架送往哪里？", "nextNodeId": "node_c2_porter_delivery_where", "requires": [{"kind": "goalCompleted", "goalId": "goal_c2_repair_reward"}]}, {"id": "choice_c2_porter_entry__done_visit", "text": "回访石伯", "nextNodeId": "node_c2_porter_revisit", "requires": [{"kind": "questStatus", "questId": "quest_c2_main", "status": "completed"}]}, {"id": "choice_c2_porter_entry__leave", "text": "改日再说", "nextNodeId": null}], "reading": "mandatory"}, {"id": "node_c2_porter_request", "text": "“她说收旧架，倒像旧账还没完。我今日肩手吃不住，你帮我试稳，送到城门前街口，当面问个明白。先去鲁七处借竿试一杆，卖鱼挣一笔，认得这街上的买卖。”", "choices": [{"id": "choice_c2_porter_request__go_fisher", "text": "先去鲁七处", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_fisher"}}, {"id": "choice_c2_porter_request__repair_accept", "text": "已经学钓、成交，接修缮", "nextNodeId": "node_c2_porter_repair_prepare", "action": {"type": "c2/acceptQuest", "payload": {"questId": "quest_c2_repair"}}, "requires": [{"kind": "goalCompleted", "goalId": "goal_c2_fishing_intro"}, {"kind": "goalCompleted", "goalId": "goal_c2_first_trade"}, {"kind": "questStatus", "questId": "quest_c2_repair", "status": "available"}]}, {"id": "choice_c2_porter_request__repair_continue", "text": "继续修缮", "nextNodeId": "node_c2_porter_repair_prepare", "requires": [{"kind": "goalCompleted", "goalId": "goal_c2_fishing_intro"}, {"kind": "goalCompleted", "goalId": "goal_c2_first_trade"}, {"kind": "questStatus", "questId": "quest_c2_repair", "status": "active"}]}, {"id": "choice_c2_porter_request__leave", "text": "改日再说", "nextNodeId": null}], "reading": "mandatory"}, {"id": "node_c2_porter_repair_prepare", "text": "石伯将货箱卸空：“白痕只是表面擦伤，真正松的是绑缚，还有歪的垫脚。先辨松处，摆正，再理绳，最后空载试稳。工钱16文，或这只铜铃，做成只领一样。”", "choices": [{"id": "choice_c2_porter_repair_prepare__repair_begin", "text": "预留18精力，开始修缮", "nextNodeId": null, "action": {"type": "c2/beginRepair", "payload": {"repairId": "repair_c2_cargo"}}, "intent": {"kind": "openRepair", "repairId": "repair_c2_cargo"}}, {"id": "choice_c2_porter_repair_prepare__need_food", "text": "先吃些东西", "nextNodeId": "node_c2_porter_food_way"}, {"id": "choice_c2_porter_repair_prepare__leave", "text": "改日再说", "nextNodeId": null}], "reading": "mandatory"}, {"id": "node_c2_porter_food_way", "text": "“王家就在沿街敞面屋前。蒸饼4文，粥6文，茶2文；手里一文没有，也还能走到店前问，莫在架边硬撑。”", "choices": [{"id": "choice_c2_porter_food_way__go_food", "text": "去王家蒸作", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_food_vendor"}}, {"id": "choice_c2_porter_food_way__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_porter_bell_past", "text": "“丁伯留下的。舌不是自己掉的，是我取下来的。我年轻时争一脚快，把顾家新盏撞坏过。钱赔清了，旁人一说收旧物，我却总以为还有账要追。”", "choices": [{"id": "choice_c2_porter_bell_past__bell_resolve", "text": "记下铃舌的缘故", "nextNodeId": "node_c2_porter_bell_recorded", "action": {"type": "c2/advanceStory", "payload": {"storyId": "story_c2_silent_bell", "stageId": "stage_c2_silent_bell_resolved"}}, "requires": [{"kind": "storyStage", "storyId": "story_c2_silent_bell", "stageId": "stage_c2_silent_bell_known"}, {"kind": "goalCompleted", "goalId": "goal_c2_repair_reward"}]}, {"id": "choice_c2_porter_bell_past__bell_read", "text": "读铜铃故事", "nextNodeId": null, "requires": [{"kind": "storyStage", "storyId": "story_c2_silent_bell", "stageId": "stage_c2_silent_bell_known"}], "intent": {"kind": "openStory", "storyId": "story_c2_silent_bell"}}, {"id": "choice_c2_porter_bell_past__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_porter_bell_recorded", "text": "铜铃不响的原因已经说清；换出它以后，风物志仍留这段来历。", "choices": [{"id": "choice_c2_porter_bell_recorded__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_porter_reward", "text": "石伯空载试过，才松开手：“架稳了。十六文工钱，或这只旧铜铃，你择一样合用的。拿钱买饭、拿铃记事，都不耽误交架。”", "choices": [{"id": "choice_c2_porter_reward__reward_cash", "text": "领16文工钱", "nextNodeId": "node_c2_porter_reward_taken", "action": {"type": "c2/chooseReward", "payload": {"repairId": "repair_c2_cargo", "choice": "cash"}}, "requires": [{"kind": "repairStatus", "repairId": "repair_c2_cargo", "status": "completed"}]}, {"id": "choice_c2_porter_reward__reward_bell", "text": "收下缺舌铜铃", "nextNodeId": "node_c2_porter_reward_taken", "action": {"type": "c2/chooseReward", "payload": {"repairId": "repair_c2_cargo", "choice": "bell"}}, "requires": [{"kind": "repairStatus", "repairId": "repair_c2_cargo", "status": "completed"}]}], "reading": "mandatory", "entryFor": "repair-completed-unrewarded"}, {"id": "node_c2_porter_reward_taken", "text": "“这一趟修缮的报酬交妥了。”石伯摸过白痕，将空箱扶正：“去门前街口吧。架我来带，你不用一路替我背着。”", "choices": [{"id": "choice_c2_porter_reward_taken__where_handoff", "text": "问交接位置", "nextNodeId": "node_c2_porter_delivery_where"}, {"id": "choice_c2_porter_reward_taken__hear_past", "text": "顺便听铃的往事", "nextNodeId": "node_c2_porter_bell_past"}], "reading": "mandatory"}, {"id": "node_c2_porter_delivery_where", "text": "“城门还在前头，咱们止在门外街口的交架处。看长木架近旁，顾娘子收架；不必过门，不必等车，也不用护送我。”", "choices": [{"id": "choice_c2_porter_delivery_where__go_handoff", "text": "去门前交接处", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_delivery"}}, {"id": "choice_c2_porter_delivery_where__leave", "text": "改日再说", "nextNodeId": null}], "reading": "mandatory"}, {"id": "node_c2_porter_handoff", "text": "顾娘子扶住架角：“我父亲那两只新盏，你早赔了。今日收丁伯旧架，是给赶路人歇担，哪里又叫你还钱？”石伯看了白痕，半晌才答：“那就稳稳放下。”", "choices": [{"id": "choice_c2_porter_handoff__handoff_confirm", "text": "在这里交妥旧架", "nextNodeId": "node_c2_porter_handoff_done", "action": {"type": "c2/handOffCargo", "payload": {"questId": "quest_c2_main", "anchorId": "anchor_c2_delivery"}}, "requires": [{"kind": "goalCompleted", "goalId": "goal_c2_fishing_intro"}, {"kind": "goalCompleted", "goalId": "goal_c2_first_trade"}, {"kind": "goalCompleted", "goalId": "goal_c2_repair_reward"}]}, {"id": "choice_c2_porter_handoff__leave", "text": "改日再说", "nextNodeId": null}], "reading": "mandatory", "entryFor": "anchor_c2_delivery"}, {"id": "node_c2_porter_handoff_done", "text": "旧架交妥，顾娘子把空篓挪到架边。石伯终于不再按着那道白痕。", "choices": [{"id": "choice_c2_porter_handoff_done__main_finish", "text": "完成这桩差事", "nextNodeId": "node_c2_porter_closing", "action": {"type": "c2/completeMain", "payload": {"questId": "quest_c2_main"}}, "requires": [{"kind": "goalCompleted", "goalId": "goal_c2_handoff"}]}], "reading": "mandatory", "entryFor": "handoff-completed-main-active"}, {"id": "node_c2_porter_closing", "text": "王小满递茶，先擦净案边。石伯接过，笑了一下：“丁伯那年也是这样叫我坐下。你先游你的，我这脚不赶。”", "choices": [{"id": "choice_c2_porter_closing__free_roam", "text": "继续游历", "nextNodeId": null}, {"id": "choice_c2_porter_closing__book_after", "text": "打开风物志", "nextNodeId": null, "intent": {"kind": "openBook", "page": "collection"}}], "reading": "mandatory", "entryFor": "main-completed", "uiNote": "主线结束。钓鱼、买卖、三件藏物与长故事可继续自由探索；城门内暂不开放。"}, {"id": "node_c2_porter_revisit", "text": "“架留在铺前，我再接短脚，不带它了。修这一回的报酬已付清；你来坐，我愿再说几句，不再叫你干同一遍活。”", "choices": [{"id": "choice_c2_porter_revisit__past_again", "text": "听旧铃往事", "nextNodeId": "node_c2_porter_bell_past"}, {"id": "choice_c2_porter_revisit__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}]}, {"id": "dialogue_c2_merchant", "npcId": "npc_c2_merchant", "entryNodeId": "node_c2_merchant_entry", "nodes": [{"id": "node_c2_merchant_entry", "text": "顾娘子把缺口盏转向案里：“瑕疵先说明，价钱才好说。旧架还没送来么？摊前正缺个放担的地方。”", "choices": [{"id": "choice_c2_merchant_entry__goods", "text": "卖杂物、买旧器", "nextNodeId": "node_c2_merchant_goods"}, {"id": "choice_c2_merchant_entry__frame_truth", "text": "问为何收石伯旧架", "nextNodeId": "node_c2_merchant_frame"}, {"id": "choice_c2_merchant_entry__cup_origin", "text": "问缺口小盏", "nextNodeId": "node_c2_merchant_cup"}, {"id": "choice_c2_merchant_entry__trade_bell", "text": "铜铃能换什么？", "nextNodeId": "node_c2_merchant_barter"}, {"id": "choice_c2_merchant_entry__bell_later", "text": "领了工钱，还想收铃", "nextNodeId": "node_c2_merchant_bell_later", "requires": [{"kind": "rewardChoice", "choice": "cash"}]}, {"id": "choice_c2_merchant_entry__repurchase", "text": "想找回误售物件", "nextNodeId": "node_c2_merchant_buyback"}, {"id": "choice_c2_merchant_entry__revisit", "text": "问交架后的铺前", "nextNodeId": "node_c2_merchant_revisit", "requires": [{"kind": "questStatus", "questId": "quest_c2_main", "status": "completed"}]}, {"id": "choice_c2_merchant_entry__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_goods", "text": "“碎陶片1文，朽木2文，旧铁件3文，旧铜扣12文。鱼送鲁七，借来的竿与虹桥三件借物不收。青釉盏18文，你要买先看缺口。”", "choices": [{"id": "choice_c2_merchant_goods__open_goods", "text": "查看杂物与旧器", "nextNodeId": null, "intent": {"kind": "openShop", "shopId": "shop_c2_general"}}, {"id": "choice_c2_merchant_goods__buy_cup", "text": "买缺口青釉小盏（18文）", "nextNodeId": "node_c2_merchant_cup_bought", "action": {"type": "c2/buy", "payload": {"shopId": "shop_c2_general", "offerId": "offer_c2_cup", "quantity": 1}}}, {"id": "choice_c2_merchant_goods__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_frame", "text": "“收的是架，不是账。丁伯从前在这里歇脚，我父亲待过他。我想给来客放担，也省得空篓堵路。那两只新盏石伯早赔清了，他偏不肯问第二句。”", "choices": [{"id": "choice_c2_merchant_frame__tell_porter", "text": "去与石伯说清", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_porter"}}, {"id": "choice_c2_merchant_frame__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_cup", "text": "“这只从前就是顾家自用的，与你们说的碎新货无关。丁伯用它喝过茶。缺口朝里，是怕赶脚人伸手急，碰伤了；不是把坏处藏着卖你。”", "choices": [{"id": "choice_c2_merchant_cup__cup_record", "text": "记下小盏来历", "nextNodeId": "node_c2_merchant_cup_recorded", "action": {"type": "c2/advanceStory", "payload": {"storyId": "story_c2_celadon_cup", "stageId": "stage_c2_celadon_cup_resolved"}}, "requires": [{"kind": "storyStage", "storyId": "story_c2_celadon_cup", "stageId": "stage_c2_celadon_cup_known"}]}, {"id": "choice_c2_merchant_cup__cup_story", "text": "读小盏故事", "nextNodeId": null, "requires": [{"kind": "storyStage", "storyId": "story_c2_celadon_cup", "stageId": "stage_c2_celadon_cup_known"}], "intent": {"kind": "openStory", "storyId": "story_c2_celadon_cup"}}, {"id": "choice_c2_merchant_cup__cup_shop", "text": "看看这只盏", "nextNodeId": "node_c2_merchant_goods"}, {"id": "choice_c2_merchant_cup__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_cup_bought", "text": "顾娘子把小盏交给阿青：“缺口我已说明，别从那边饮。”实物已收入行囊，物件卡和完整故事一同留在风物志。", "choices": [{"id": "choice_c2_merchant_cup_bought__cup_question", "text": "再问一句来历", "nextNodeId": "node_c2_merchant_cup"}, {"id": "choice_c2_merchant_cup_bought__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_cup_recorded", "text": "小盏与两只新货的区别已经说清；转缺口的用意，也记在风物志里。", "choices": [{"id": "choice_c2_merchant_cup_recorded__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_barter", "text": "“旧铃换这只青釉盏，一次便清。先把石伯的往事问明，再在行囊里亲手解除铃的保护；换出去，铜铃仍记在书里，手中实物就归我。”", "choices": [{"id": "choice_c2_merchant_barter__open_barter", "text": "查看换物条件", "nextNodeId": null, "intent": {"kind": "openShop", "shopId": "shop_c2_general"}}, {"id": "choice_c2_merchant_barter__ask_bell", "text": "先问石伯", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_porter"}}, {"id": "choice_c2_merchant_barter__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_bell_later", "text": "“你领工钱以后，石伯把铃托给我。你若还想记这段事，可以20文买下，只这一只。先前已收过铃的人，不能再取第二只。”", "choices": [{"id": "choice_c2_merchant_bell_later__buy_bell", "text": "买缺舌铜铃（20文）", "nextNodeId": "node_c2_merchant_bell_bought", "action": {"type": "c2/buy", "payload": {"shopId": "shop_c2_general", "offerId": "offer_c2_bell_later", "quantity": 1}}, "requires": [{"kind": "rewardChoice", "choice": "cash"}]}, {"id": "choice_c2_merchant_bell_later__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_bell_bought", "text": "铃已交到阿青手中，顾娘子把这笔划清：“还想问铃舌，石伯就在这段街上。”", "choices": [{"id": "choice_c2_merchant_bell_bought__bell_question", "text": "去问石伯", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_porter"}}, {"id": "choice_c2_merchant_bell_bought__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_buyback", "text": "“误卖来我这儿的，还在回购单里便可找回。按那笔售钱取，不加价；换出去的不是误售，不能假作另一笔取回。先看实物与数量，再认这一笔。”", "choices": [{"id": "choice_c2_merchant_buyback__open_buyback", "text": "看回购单", "nextNodeId": null, "intent": {"kind": "openShop", "shopId": "shop_c2_general", "tab": "buyback"}}, {"id": "choice_c2_merchant_buyback__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_merchant_revisit", "text": "“架稳，担也有地方放。来往人各有生计，不必为一只旧盏停了所有买卖。你带走的是物，我们留下的交情还在。”", "choices": [{"id": "choice_c2_merchant_revisit__goods_again", "text": "看看物件", "nextNodeId": "node_c2_merchant_goods"}, {"id": "choice_c2_merchant_revisit__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}]}, {"id": "dialogue_c2_food_vendor", "npcId": "npc_c2_food_vendor", "entryNodeId": "node_c2_food_vendor_entry", "nodes": [{"id": "node_c2_food_vendor_entry", "text": "王小满把笼盖侧着揭起，避开热汽：“先坐稳。饼4文，粥6文，茶2文。肚里有食，才有力替人做事。”", "choices": [{"id": "choice_c2_food_vendor_entry__menu", "text": "买饭或茶", "nextNodeId": "node_c2_food_vendor_food"}, {"id": "choice_c2_food_vendor_entry__credit", "text": "身上无钱又无力，能否赊食？", "nextNodeId": "node_c2_food_vendor_relief"}, {"id": "choice_c2_food_vendor_entry__frame_memory", "text": "问旧架的白痕", "nextNodeId": "node_c2_food_vendor_frame"}, {"id": "choice_c2_food_vendor_entry__token_points", "text": "木牌背面的点痕", "nextNodeId": "node_c2_food_vendor_token", "requires": [{"kind": "storyStage", "storyId": "story_c2_marked_token", "stageId": "stage_c2_marked_token_known"}]}, {"id": "choice_c2_food_vendor_entry__cup_edge", "text": "小盏为何缺口朝里？", "nextNodeId": "node_c2_food_vendor_cup"}, {"id": "choice_c2_food_vendor_entry__revisit", "text": "交架后再来坐坐", "nextNodeId": "node_c2_food_vendor_revisit", "requires": [{"kind": "questStatus", "questId": "quest_c2_main", "status": "completed"}]}, {"id": "choice_c2_food_vendor_entry__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_food_vendor_food", "text": "“饼新揭笼，粥也热。喝茶可歇脚，真要接着干活，先吃饭更合用。肚子不空便不必多买。”", "choices": [{"id": "choice_c2_food_vendor_food__eat_bread", "text": "吃蒸饼（4文）", "nextNodeId": "node_c2_food_vendor_ate", "action": {"type": "c2/eat", "payload": {"shopId": "shop_c2_food", "offerId": "offer_c2_bread"}}}, {"id": "choice_c2_food_vendor_food__eat_congee", "text": "吃粥（6文）", "nextNodeId": "node_c2_food_vendor_ate", "action": {"type": "c2/eat", "payload": {"shopId": "shop_c2_food", "offerId": "offer_c2_congee"}}}, {"id": "choice_c2_food_vendor_food__drink_tea", "text": "喝茶（2文）", "nextNodeId": "node_c2_food_vendor_ate", "action": {"type": "c2/eat", "payload": {"shopId": "shop_c2_food", "offerId": "offer_c2_tea"}}}, {"id": "choice_c2_food_vendor_food__food_counter", "text": "看当前精力与价钱", "nextNodeId": null, "intent": {"kind": "openShop", "shopId": "shop_c2_food"}}, {"id": "choice_c2_food_vendor_food__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional", "uiNote": "蒸饼4文/+30、粥6文/+45、茶2文/+10；精力上限100。满精力不成交，不白扣钱。"}, {"id": "node_c2_food_vendor_ate", "text": "伙计把饭盏撤到案里，给你的担具留出路：“这一份已付清。再走不迟。”", "choices": [{"id": "choice_c2_food_vendor_ate__to_repair", "text": "去旧架处", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_repair"}}, {"id": "choice_c2_food_vendor_ate__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional", "uiNote": "实际补充精力与铜钱扣除，以服务保存成功结果显示。"}, {"id": "node_c2_food_vendor_relief", "text": "“身上没钱，肚里也空，可先赊一份蒸饼，记4文饭钱。卖鱼或领工钱，先偿了再算自己的。旧账没清，我便不能再记第二份。”", "choices": [{"id": "choice_c2_food_vendor_relief__request_relief", "text": "按条件赊一份蒸饼", "nextNodeId": "node_c2_food_vendor_relief_given", "action": {"type": "c2/requestRelief", "payload": {"shopId": "shop_c2_food"}}}, {"id": "choice_c2_food_vendor_relief__normal_food", "text": "查看正常饭食", "nextNodeId": "node_c2_food_vendor_food"}, {"id": "choice_c2_food_vendor_relief__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional", "uiNote": "条件：铜钱<4、可用精力<4、欠账为0。赊食补30、欠4；下一杆救急保普通鱼，简易收杆不失败。"}, {"id": "node_c2_food_vendor_relief_given", "text": "王小满把饼递来，在账边记清：“先吃。这4文记在我这里，下一脚做成再还。竿鲁七肯借你，别空着肚子硬撑。”", "choices": [{"id": "choice_c2_food_vendor_relief_given__relief_fish", "text": "去鲁七钓鱼偿账", "nextNodeId": null, "intent": {"kind": "navigate", "anchorId": "anchor_c2_fishing_a", "fishingMode": "relief"}}, {"id": "choice_c2_food_vendor_relief_given__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional", "uiNote": "赊食和欠账已同次保存；刷新不能再次领取，下一次收入先偿债。"}, {"id": "node_c2_food_vendor_frame", "text": "“那道白痕旧得很，不是今日裂开的。娘说丁伯当年把架放下，叫石伯先喝茶。石伯见盏口缺了，竟不敢端，以为人家罚他。娘说，缺的是自用旧盏，新货另算。”", "choices": [{"id": "choice_c2_food_vendor_frame__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_food_vendor_token", "text": "“我娘认得其中一回：她留饭，鲁七母亲后来送鱼，谁也没叫谁白吃。那五个点只记他们几家的来往，不是满街都认的记号。”", "choices": [{"id": "choice_c2_food_vendor_token__token_book", "text": "读木牌故事", "nextNodeId": null, "intent": {"kind": "openStory", "storyId": "story_c2_marked_token"}}, {"id": "choice_c2_food_vendor_token__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_food_vendor_cup", "text": "“端茶先把案边水擦了，盏不滑，手才稳。缺口转离客人的手，顾娘子也这样。你看见这个动作，便知道旧盏不是拿来罚谁的。”", "choices": [{"id": "choice_c2_food_vendor_cup__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}, {"id": "node_c2_food_vendor_revisit", "text": "“石伯坐下喝过茶了。以后顾家架上能放担，我这案前也不必挤满桶。你进城前想歇一歇，还是这三样饭茶。”", "choices": [{"id": "choice_c2_food_vendor_revisit__food_again", "text": "吃饭喝茶", "nextNodeId": "node_c2_food_vendor_food"}, {"id": "choice_c2_food_vendor_revisit__leave", "text": "改日再说", "nextNodeId": null}], "reading": "optional"}]}], "stories": [{"id": "story_c2_marked_token", "itemId": "treasure_c2_marked_token", "sectionIdPrefix": "section_c2_marked_token_", "contentVersion": 1, "requiredForMain": false, "stageIds": ["stage_c2_marked_token_known", "stage_c2_marked_token_resolved"], "title": "木牌背面", "acquisitionTip": "木牌正面三道深痕，背面五个小点，不像一笔账。", "objectCard": "一片掌心长的旧木牌，穿孔边缘被绳勒成斜槽，正面三道刀痕很深，背面五个小点却轻浅。它原是鲁七母亲随鱼桶带着的小记号，落水后由阿青在安全浅岸取回，经鲁七同意赠留。深痕记桶，浅点记她替人留下的五份鱼；不是官府验货凭信，也不能拿它向别人索取鱼钱。", "sections": [{"id": "section_c2_marked_token_01", "title": "三道刀痕", "paragraphs": ["鲁七把木牌翻过来，先用拇指摸那三道痕。小时候母亲挑鱼进市，他只够提半桶。母亲不逼他认字，在一片木上划三刀，教他沿途数桶，交鱼时数清，回家还要再数一回。他觉得这办法笨，等自己长成，能掂斤两、会说价了，便把木牌丢在旧篓底。", "母亲一早出门，桶里的清水总晃湿鞋面。别人问价，她回得快；一到丁伯歇担的屋前，却要停下。她让鲁七提桶，自己挑一尾鱼交过去。鲁七低声问，鱼钱收不收。母亲只说：“这尾算在我这里。”他回家重数铜钱，总疑心这条街占了他们便宜。"], "paragraphIds": ["section_c2_marked_token_01_p01", "section_c2_marked_token_01_p02"]}, {"id": "section_c2_marked_token_02", "title": "背面的五点", "paragraphs": ["后来母亲到姐姐家住，鲁七收拾鱼篓，发现木牌背面还有五个细点。他以为母亲算漏了五笔，提牌去问王家。王家妇人擦着案板笑起来，说那不是欠鱼钱：丁伯替她搬过柴，顾家借过她空器，几个人各有一次急难，鲁七母亲把留下的鱼记着，免得一人受了照应、另一人只站着看。", "鲁七记起有一年自己病了，母亲走不开，鱼却照样进了街市。丁伯挑前担，石伯提后桶，送回来时桶底干净，钱也没少一文。他当时只顾数钱，不曾问谁把那段路走完了。木牌背面的点很小，倒比正面三刀更费手。母亲不是不会算，只是那一面没有拿来叫人还账。"], "paragraphIds": ["section_c2_marked_token_02_p01", "section_c2_marked_token_02_p02"]}, {"id": "section_c2_marked_token_03", "title": "浅水里的旧物", "paragraphs": ["前些日子，旧系绳断了，牌滑进近岸浅水。鲁七肩膀不便，自己摸了两回，泥水越搅越浑。见阿青来，他不叫书生涉河，只指安全岸边的一小处，让他借竿把木片带上来。牌上泥一洗，深刀与细点一齐露出。鲁七看了片刻，把木牌擦干，并没有再系回自己的桶。", "“三桶鱼，我如今不用它也数得清。”他说，“背面那五点，我倒是许久才看懂。你肯记人家的事，便带着。只是它不抵鱼钱，也不是什么过门凭信。”阿青收入风物志，记清旧主人仍有姓名，不将这片木头说成河里无主的宝物。"], "paragraphIds": ["section_c2_marked_token_03_p01", "section_c2_marked_token_03_p02"]}, {"id": "section_c2_marked_token_04", "title": "本街已知的一段", "paragraphs": ["王小满在蒸作案边见到木牌，认出其中一个点所记的旧事：他母亲那年给搬运人留了饭，后来鲁七母亲送鱼来，谁也没把对方当作白吃的客人。来往久了，两家都能在对方店前放下担具。木牌的刻点是这个小圈子自己的记法，不是东京人人通用的规矩。", "如今已弄清两面的不同用途，也弄清鲁七愿意赠牌的缘故。他没有忽然改成不计价的渔夫，卖鱼仍照价收钱；只是再看街上的木架、空桶、热饭时，不只看谁欠了谁。牌边还有一道磨掉的浅痕，可供将来的游历追问；鲁七把最后一滴水擦去，母亲做过的事，也就随着两面的刻痕留下了。"], "paragraphIds": ["section_c2_marked_token_04_p01", "section_c2_marked_token_04_p02"]}], "sourceIds": ["src_c2_fishmarket", "src_c2_labor", "src_c2_fiction"], "historicalNote": "浅抱桶和市井雇工参考《东京梦华录》；木牌记桶、刻点记人、母子经历与赠物均为虚构私记，非官方凭信或已证实通行习俗。", "reading": "optional", "fullTextOnAcquisition": true, "narrator": "游戏叙事正文；不是从古籍摘出的真实人物传记。", "unlockRule": {"kind": "collectionEverObtained", "itemId": "treasure_c2_marked_token"}, "doesNotRequireFutureRegion": true}, {"id": "story_c2_silent_bell", "itemId": "treasure_c2_silent_bell", "sectionIdPrefix": "section_c2_silent_bell_", "contentVersion": 1, "requiredForMain": false, "stageIds": ["stage_c2_silent_bell_known", "stage_c2_silent_bell_resolved"], "title": "他亲手取下的铃舌", "acquisitionTip": "铃口磨偏，舌却是亲手取下的；石伯为何留着它？", "objectCard": "一只小铜铃，铃口一侧磨薄，内壁留着撞击痕，挂耳穿过的旧绳已经发亮，里面却没有铃舌。旧主人是脚夫丁伯，后来传给石伯，私系于小脚架旁唤同伴。石伯年轻时误把响声当催促，失手碰损两只新盏，赔清后仍留着它。铜铃可作物酬；先问清往事再解除保护，才可换物或出售。", "sections": [{"id": "section_c2_silent_bell_01", "title": "一响便走", "paragraphs": ["石伯年轻时最怕师父歇脚。丁伯把空架往屋前一放，先摸绳，再喝茶；他却看别家的车马已经过去，心里就急。架旁私系着一只小铜铃，丁伯招同伴时摇一下，他便抢着起担。他以为响声就是催人快走，不愿等老人的手在绳上来回摸。", "有一回顾家两只新盏束在箱里，木架一边垫得高，另一边还未坐实。丁伯叫他放下吃点东西，他说早到了便能早挣下一脚钱。才绕过摊边，箱身斜过去，两只盏沿撞在一处。碎声很轻，他反倒先听见铜铃乱响。丁伯接住架，叫他别再拉，随后才开箱。"], "paragraphIds": ["section_c2_silent_bell_01_p01", "section_c2_silent_bell_01_p02"]}, {"id": "section_c2_silent_bell_02", "title": "赔清了什么", "paragraphs": ["货钱照约赔清。顾家父亲数完钱，没再多说一句重话。石伯却盯着那只铃，像它方才故意催了自己。丁伯给他一盏茶，盏口也缺了一块，石伯不敢接，怕又碰坏什么。师父把盏放稳，说：“是顾家自用的旧盏。你赔的是新货，莫连吃茶都赔进去。”", "石伯后来把铃舌取下，铜铃仍留在架边。起初是怕再听见那一声；再后来，他不靠声音催步，学会用手试架，用眼看左右负载。一条绳用坏了可以换，木上磨损也须查看，不能把每一道伤都涂上好颜色，当它从未受过力。丁伯笑他慢，他便真肯慢一些了。"], "paragraphIds": ["section_c2_silent_bell_02_p01", "section_c2_silent_bell_02_p02"]}, {"id": "section_c2_silent_bell_03", "title": "又来收架的人", "paragraphs": ["丁伯去世后，石伯仍用旧架接短脚。顾家换顾娘子守摊，她说想收这副架，他先想到那两只新盏。顾娘子要在摊前给来客歇担，他却听成把旧木拆作抵钱。他没有问第二句，只答自己再修一修。不是钱没还，是当年那一跤还在他心里，谁提起旧物，他都先低了头。", "阿青替他摆正木脚、理好绑缚，手移到白痕处，石伯立刻挡了一下，随后自己松开手：“留着便是。如今歪在这里，与你无干。”试稳后，他把铜铃与工钱一同拿出来，让书生择一样。拿铃可记旧事，拿钱可买饭；阿青哪样合用，便领哪样。"], "paragraphIds": ["section_c2_silent_bell_03_p01", "section_c2_silent_bell_03_p02"]}, {"id": "section_c2_silent_bell_04", "title": "铃不必再替人说话", "paragraphs": ["到了门前，顾娘子接架，先看它能不能稳放，再说顾家那笔旧账早已清了。架留在铺前，赶路人放担，她自己也省得让空篓堵过道。王小满端来的茶没搁在箱盖上，而是稳稳放到案边。石伯看了白痕，才说出铜铃没有坏，是铃舌被他收起了。", "这一天不必替铃配新舌，也不用再赔一只盏。阿青若收铃，便记下它的来历；若收钱，石伯后来把铃托给顾娘子，书生仍有一次买到它的机会。木架已经交出，石伯也承认自己曾经争快。旧事并没有被抹掉，但不再替他决定每一步往哪里走。"], "paragraphIds": ["section_c2_silent_bell_04_p01", "section_c2_silent_bell_04_p02"]}], "sourceIds": ["src_c2_transport", "src_c2_craft", "src_c2_fiction"], "historicalNote": "《般载杂卖》写太平车的铁铃；本篇铜铃、私系小脚架、失手与取舌为游戏创作，不能由铁铃记载推出铜铃的原画归属。", "reading": "optional", "fullTextOnAcquisition": true, "narrator": "游戏叙事正文；不是从古籍摘出的真实人物传记。", "unlockRule": {"kind": "collectionEverObtained", "itemId": "treasure_c2_silent_bell"}, "doesNotRequireFutureRegion": true}, {"id": "story_c2_celadon_cup", "itemId": "treasure_c2_celadon_cup", "sectionIdPrefix": "section_c2_celadon_cup_", "contentVersion": 1, "requiredForMain": false, "stageIds": ["stage_c2_celadon_cup_known", "stage_c2_celadon_cup_resolved"], "title": "缺口朝哪边", "acquisitionTip": "掌柜把缺口转向案里，却不许把这只旧盏叫作废物。", "objectCard": "小盏敞口、浅弧腹、圈足，青釉略显灰绿，口沿一处缺损已被长久使用磨钝，底足露胎处留有细擦痕。它原是顾家自用的茶盏，不在石伯当年碰损的新货里。丁伯喝过，王家妇人也曾替人端过。顾娘子把它转离手边，是怕客人碰伤；并不是藏瑕疵，更不说它是宫中名窑宝器。", "sections": [{"id": "section_c2_celadon_cup_01", "title": "先看盏口", "paragraphs": ["顾娘子摆旧物，总要先转一次盏。阿青问她是不是怕人见到缺口，她把盏推到亮处：“见得越清越好。这边缺了，喝茶便从另一边喝。拿回去摆着也罢，别认作整器。”父亲教她看胎、看底足，她先学会的却是看人的手：客人端得急，缺口就不该正对着手。", "幼时她只爱摊上成对的新盏。新釉照得出窗影，父亲擦完，叫她拿远些，免得裙角扫落。案边这只小盏不成对，底足也磨粗了。她想把它藏到后面，父亲又拿出来，用来喝自己的茶。卖给人的新货须交代清楚，自己用过的东西，也不必一坏就扔。"], "paragraphIds": ["section_c2_celadon_cup_01_p01", "section_c2_celadon_cup_01_p02"]}, {"id": "section_c2_celadon_cup_02", "title": "不是那两只", "paragraphs": ["石伯失手那天，她在摊前听见争论。两只新盏碎了，脚夫赔钱，父亲照约收下。后来丁伯坐到案边，他拿这只旧盏盛茶，又把茶递给不敢伸手的徒弟。小姑娘以为父亲拿破盏罚他，回家闷闷不乐。父亲让她摸底足：磨了多少年，怎么会是今早箱里才来的新货？", "王家妇人端汤茶过来时，常替他们擦净案边。她说新器旧器要各归各的账，做事也一样。赔了货，下一回仍能好好做事；一盏茶不该变成另一笔罚钱。顾娘子小时候未必全懂，却记住那天下午，石伯两手抱盏，坐了很久，丁伯也没有催他起来。"], "paragraphIds": ["section_c2_celadon_cup_02_p01", "section_c2_celadon_cup_02_p02"]}, {"id": "section_c2_celadon_cup_03", "title": "守摊人的眼光", "paragraphs": ["后来父亲把摊交给她。来的人有人只问新不新，有人只问贵不贵，也有人认得这只缺口盏，停下说丁伯从前怎样坐在这里。她没有因此给小盏编一个显赫出身，只记清谁用过。小盏可售，价钱当面说；来历若不肯讲，卖给爱记事的书生便少了半件东西。", "她想收丁伯旧架，石伯却总拖着修。她原先以为老人舍不得价钱，直到王小满提起那两只新盏，才明白他还将收架当作追债。她让伙计把空篓挪开，给架留一块地方，等它真的交来便当面说清。话绕了多年，只因一个人怕提旧错，另一个人以为不必再解释。"], "paragraphIds": ["section_c2_celadon_cup_03_p01", "section_c2_celadon_cup_03_p02"]}, {"id": "section_c2_celadon_cup_04", "title": "门前一盏热茶", "paragraphs": ["旧架交接后，王小满端茶，先擦案边，再将盏口转向里侧。他不是怕人发现缺损，是怕来客提着担、伸手太快。石伯看见这个小动作，认出那天下午王家妇人的手势。顾娘子说：“缺口我先说明，架上的伤你也留下。今后的担，稳稳放在这里便好。”", "阿青买小盏，或用已经问清来历的铜铃来换，顾娘子都将物件当面交清。小盏属于他，顾家仍有自己的摊，石伯仍接脚，王小满仍要数饭钱。风物志记下这只盏不是当年摔坏的新货，也记下缺口为何朝里。这一问终于说清，盏还是那只盏，端茶的手势也留在这条街上。"], "paragraphIds": ["section_c2_celadon_cup_04_p01", "section_c2_celadon_cup_04_p02"]}], "sourceIds": ["src_c2_celadon", "src_c2_daily", "src_c2_dawn", "src_c2_fiction"], "historicalNote": "宋青瓷形制参考馆藏说明；缺口、磨损、茶事和顾家全部关系为虚构。无窑口鉴定、御用身份、器物灵力或原画实名认定。", "reading": "optional", "fullTextOnAcquisition": true, "narrator": "游戏叙事正文；不是从古籍摘出的真实人物传记。", "unlockRule": {"kind": "collectionEverObtained", "itemId": "treasure_c2_celadon_cup"}, "doesNotRequireFutureRegion": true}], "sources": [{"id": "src_c2_painting", "title": "张择端《清明上河图》卷：故宫原作说明", "url": "https://www.dpm.org.cn/collection/paint/228226.html", "locator": "原作中段至城门前；本地S02–S11外观对照", "kind": "painting", "applicableScope": "舟岸、街路、棚摊、负载行人和车马的画面关系。", "limitations": "不能据图确认本关四人姓名、店号、货物或旧事；门名/桥名研究不用于本关解谜。", "shortQuote": "", "checkedDate": "2026-10-01"}, {"id": "src_c2_scan", "title": "原作扫描与项目局部观察表", "url": "https://commons.wikimedia.org/wiki/File:Alongtheriver_QingMing.jpg", "locator": "38414×1800扫描；S03/S04/S06/S07/S08/S09/S10", "kind": "painting", "applicableScope": "本关场景外观和邻接；原画可见/身份未定分栏。", "limitations": "不把原画像素当三维坐标；画中摊屋经营内容仍未核定。", "shortQuote": "", "checkedDate": "2026-10-01"}, {"id": "src_c2_river", "title": "孟元老《东京梦华录》卷一·河道", "url": "https://zh.wikisource.org/zh-hans/東京夢華錄/卷一", "locator": "河道：汴河与东南粮物入京", "kind": "primary", "applicableScope": "水运与东京日常供应之间的关系。", "limitations": "南宋追记北宋；不证明S02某船载官粮或S04是官仓。", "shortQuote": "", "checkedDate": "2026-10-01"}, {"id": "src_c2_transport", "title": "孟元老《东京梦华录》卷三·般载杂卖", "url": "https://zh.wikisource.org/zh-hans/東京夢華錄/卷三", "locator": "般载杂卖：太平车、平头车、人拽车辆和驮载", "kind": "primary", "applicableScope": "车辆形制、运输环境、太平车用铃警示来车。", "limitations": "文中明写铁铃；本关铜铃是虚构私用小铃，不作宋代车铃标准复原，不给原画车强定车名。", "shortQuote": "中间悬一铁铃", "checkedDate": "2026-10-01"}, {"id": "src_c2_labor", "title": "孟元老《东京梦华录》卷三·雇觅人力", "url": "htt
