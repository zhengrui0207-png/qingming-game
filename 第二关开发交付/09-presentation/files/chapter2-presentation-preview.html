<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>D区 · 演出与声音验收</title><style>body{margin:0;background:#bec7bf;color:#eee7d5;font:14px system-ui}#game{width:100vw;height:100vh;display:block}#dev{position:fixed;left:16px;top:16px;width:245px;max-height:83vh;overflow:auto;background:#23332ce6;border:1px solid #a6a082;padding:14px;border-radius:4px;z-index:80}#dev h1{font:22px "Songti SC",serif;margin:0 0 8px}#dev p{line-height:1.6;margin:8px 0}#dev button,#dev select{background:#efe5ce;color:#2d3b32;border:0;padding:8px 10px;border-radius:3px;margin:3px;cursor:pointer}#dev label{display:block;margin:9px 0}#status{white-space:pre-wrap;font-size:12px;color:#d2c6a8}#toast{position:fixed;top:18px;left:35%;right:20%;background:#263a2a;padding:14px;z-index:90}#toast:empty{display:none}#book{position:fixed;inset:15% 25%;background:#f0e4c8;color:#3b4636;padding:30px;z-index:90;line-height:1.8}#book[hidden]{display:none}.compact #dev{width:auto}.compact #dev .details{display:none}</style></head><body><canvas id="game" tabindex="0" aria-label="D区实景演出预览"></canvas><aside id="dev"><h1>河岸入街 · 镜头验收</h1><button id="compact">收起验收面板</button><div class="details"><p>真实核心 / 隔离 DEV 存档。人物动作含程序化原型；本页不是第二关完整装配，也不是真人试玩。</p><button id="intro">新档入区</button><button id="cash">现金报酬结局</button><button id="bell">铜铃报酬结局</button><button id="reviewIntro">回顾入区</button><button id="reviewEnding">回顾结局</button><button id="skip">略过待播演出</button><button id="openBook">打开风物志</button><button id="audio">开启声音</button><label>反馈试听 <select id="cue"></select></label><button id="audition">试听所选音效</button><label><input id="fail" type="checkbox">注入存档失败</label><button id="retry">重试保存</button><p>WASD行走 / 拖动转向 / Esc略过。预览准备按钮按真实核心顺序完成任务，站位自动切至实测锚点。</p><pre id="status">正在加载真实场景与主角…</pre></div></aside><div id="toast" role="status"></div><article id="book" hidden><h2>风物志 · 演出中开书恢复</h2><p>本页只验证开书时镜头归还、暂停精力与关闭后的控制恢复。正式长文排版由 07 风物志模块接入。</p><button id="closeBook">合书回到街市</button></article><script type="module" src="/src/chapter2/presentation/preview.js"></script></body></html>
